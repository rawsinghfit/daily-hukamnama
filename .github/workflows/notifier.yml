name: Hukamnama notifier

# When a new Hukamnama appears on BaniDB, sends its first line to every app
# user (Firebase topic "daily-hukamnama").
#
# GitHub often starts scheduled runs hours late or skips them, so any scheduled
# run that starts between midnight and 11:00 India time keeps watching BaniDB
# and stops as soon as today's Hukamnama has been sent. A run that reaches its
# time limit first starts the next one, so the watch carries on until the
# Hukamnama is sent or the window closes. Outside the window a run checks once.
on:
  schedule:
    - cron: '50 22 * * *' # 04:20 India time
    - cron: '35 23 * * *' # 05:05 India time
    - cron: '25 0 * * *'  # 05:55 India time
    - cron: '20 1 * * *'  # 06:50 India time
    - cron: '43 * * * *'  # hourly
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the notification, do not send it'
        type: boolean
        default: false
      watch:
        description: 'Keep watching during the morning window (used by the notifier itself)'
        type: boolean
        default: false

permissions:
  contents: write # records the last date sent in notifier/last-sent.txt
  actions: write # starts the next watching run

concurrency:
  group: hukamnama-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet google-auth requests

      - name: Check BaniDB and notify
        id: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          WATCH_MINUTES: ${{ (github.event_name == 'schedule' || inputs.watch) && '330' || '0' }}
        run: python3 tool/notify_hukamnama.py

      - name: Record the date sent
        run: |
          if [ -n "$(git status --porcelain notifier)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notifier
            git commit -m "Record Hukamnama notification for $(cat notifier/last-sent.txt) [skip ci]"
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Keep watching in a new run
        if: steps.notify.outputs.next_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notifier.yml --ref main -f watch=true
