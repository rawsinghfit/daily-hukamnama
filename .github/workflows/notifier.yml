name: Hukamnama notifier

# When a new Hukamnama appears on BaniDB, sends its first line to every app
# user (Firebase topic "daily-hukamnama").
#
# GitHub often starts scheduled runs late or skips them, so the morning runs
# (around 4:30-7:30 India time) keep watching BaniDB for up to 3 hours and stop
# as soon as today's Hukamnama has been sent. The hourly run is a fallback
# that checks once.
on:
  schedule:
    - cron: '50 22 * * *' # 04:20 India time, watches
    - cron: '35 23 * * *' # 05:05 India time, watches
    - cron: '25 0 * * *'  # 05:55 India time, watches
    - cron: '20 1 * * *'  # 06:50 India time, watches
    - cron: '43 * * * *'  # hourly fallback, checks once
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the notification, do not send it'
        type: boolean
        default: false

permissions:
  contents: write # records the last date sent in notifier/last-sent.txt

concurrency:
  group: hukamnama-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet google-auth requests

      - name: Check BaniDB and notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          WATCH_MINUTES: ${{ (github.event_name == 'schedule' && github.event.schedule != '43 * * * *') && '180' || '0' }}
        run: python3 tool/notify_hukamnama.py

      - name: Record the date sent
        run: |
          if [ -n "$(git status --porcelain notifier)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notifier
            git commit -m "Record Hukamnama notification for $(cat notifier/last-sent.txt) [skip ci]"
            git pull --rebase --quiet origin main
            git push
          fi
