name: Build Daily Hukamnama

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the test APK as a release download
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android and web platform folders
        run: flutter create . --platforms=android,web --org com.gurbaniwallpapers --project-name daily_hukamnama

      - name: Configure Android app (name, permissions, AdMob ID, notification icon, signing)
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: python3 tool/configure_android.py

      - name: Set web app name
        run: |
          sed -i 's|<title>[^<]*</title>|<title>Daily Hukamnama</title>|; s|apple-mobile-web-app-title" content="[^"]*"|apple-mobile-web-app-title" content="Daily Hukamnama"|' web/index.html
          sed -i 's|"name": "[^"]*"|"name": "Daily Hukamnama"|; s|"short_name": "[^"]*"|"short_name": "Hukamnama"|; s|"background_color": "[^"]*"|"background_color": "#FBF6EC"|; s|"theme_color": "[^"]*"|"theme_color": "#7A1F2B"|; s|"description": "[^"]*"|"description": "Daily Hukamnama from Sri Darbar Sahib."|' web/manifest.json

      - name: Add Play upload key (if set up)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::warning::No Play upload key set. The app bundle is signed with a debug key and cannot be uploaded to Google Play."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyPassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
          } > android/key.properties

      - name: Get packages
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
          (cd tool && python3 -m unittest -v test_notify_hukamnama)

      # The test APK keeps Google's test ads, so tapping ads while testing
      # never counts as invalid traffic. Only the Play bundle gets real ad units.
      # Firebase settings (repository variables) turn on the daily notification.
      - name: Build Android APK and Play Store bundle
        env:
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          FIREBASE="--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          ADS=""
          if [ -n "$ADMOB_BANNER_ID" ]; then ADS="--dart-define=ADMOB_BANNER_ID=$ADMOB_BANNER_ID"; fi
          flutter build apk --release --build-number=${{ github.run_number }} $FIREBASE
          flutter build appbundle --release --build-number=${{ github.run_number }} $FIREBASE $ADS

      - name: Upload Android app
        uses: actions/upload-artifact@v4
        with:
          name: android-test-app
          path: build/app/outputs/flutter-apk/app-release.apk

      # A direct .apk link that is easy to open on a phone (no zip, no sign-in):
      # https://github.com/<owner>/<repo>/releases/download/android-test/daily-hukamnama-test.apk
      - name: Publish test APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk daily-hukamnama-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test daily-hukamnama-test.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Android test app (build ${{ github.run_number }})" \
            --notes "Latest test build for Android phones. Shows Google's test ads only. Not for the Play Store."

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-store-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Build web app
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          cp pages/privacy.html build/web/privacy.html

      - name: Upload web app for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
