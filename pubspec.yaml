name: daily_hukamnama
description: "Daily Hukamnama from Sri Darbar Sahib, live from BaniDB."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# App icons, generated in the cloud after `flutter create` (see build.yml).
flutter_launcher_icons:
  image_path: "store/app-icon-1024.png"
  android: true
  ios: false
  min_sdk_android: 24
  adaptive_icon_background: "#FBF6EC"
  adaptive_icon_foreground: "store/app-icon-foreground.png"
  web:
    generate: true
    image_path: "store/app-icon-1024.png"
    background_color: "#FBF6EC"
    theme_color: "#7A1F2B"
